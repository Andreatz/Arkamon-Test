name: Arkamon Test Rework Checks

on:
  push:
    branches:
      - 'rework/**'
  pull_request:
    paths:
      - '.github/workflows/rework-checks.yml'
      - 'src/**'
      - 'e2e/rework-title.spec.ts'
      - 'e2e/rework-cinematic-battle.spec.ts'
      - 'ui-source/**'
      - 'public/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'docs/rework/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arkamon-test-rework-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci
      - name: TypeScript contracts
        run: npx tsc --noEmit
      - name: Battle engine regression tests
        run: npx vitest run src/engine/__tests__ --maxWorkers=2
      - name: Presentation director and legacy cue regression tests
        run: npx vitest run src/components/battle/battlePresentationDirector.test.ts src/components/battle/battleVisualSequence.test.ts src/components/battle/battleCameraLanguage.test.ts --maxWorkers=2
      - name: Lightweight web build
        run: npm run build
        env:
          GITHUB_PAGES: 'true'
      - name: Install browser for title visual smoke
        run: npx playwright install --with-deps chromium
      - name: Check title rework desktop and mobile
        run: npx playwright test e2e/rework-title.spec.ts --project=chromium --workers=1 --reporter=list
      - name: End-to-end battle KO, dice reveal and durable checkpoint
        run: npx playwright test e2e/battle-chronicle.spec.ts --grep 'Suprema reveals KO after dice' --project=chromium --workers=1 --reporter=list --output=output/rework-battle-e2e
      - name: Real battle cinematic camera, lighting and reduced-motion checks
        run: npx playwright test e2e/rework-cinematic-battle.spec.ts --project=chromium --workers=1 --reporter=list --output=output/rework-cinema-playwright
      - name: Upload before-after arena frames, cinematic video and phase diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arkamon-test-cinematic-battle
          path: |
            output/rework-cinema/
            output/rework-cinema-playwright/
          if-no-files-found: warn
          retention-days: 14
      - name: Preserve battle failure trace
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: arkamon-test-battle-failure
          path: output/rework-battle-e2e/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload title screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arkamon-test-title-rework
          path: output/rework-visual/
          if-no-files-found: warn
          retention-days: 14
      - name: Rework verification summary
        if: always()
        run: |
          echo '## Arkamon-Test — verified fork' >> "$GITHUB_STEP_SUMMARY"
          echo 'This is a lightweight test build with heavy media served from an immutable Beta revision, not a full media integrity check.' >> "$GITHUB_STEP_SUMMARY"
